#------------------------------------------------------------------------------
# specpack: SPEC CPU2017, cross-compiled for a single-core RISC-V Linux target
# (rv64gc, static), validated on an x86 host through QEMU user mode.
#
# Derived from SPEC's config/Example-gcc-linux-aarch64.cfg (kit 1.1.9), the
# example for a 64-bit non-x86 Linux target. Language levels (-std=c99,
# -std=c++03), portability flags and GCC workarounds are SPEC's. Changes:
# label, threads = 1, cross compiler with -static (no runtime library path),
# -march=rv64gc -mabi=lp64d instead of -mcpu=native, base tuning only,
# GCCge10 defined (GCC 13), deletework, and the host_run section at the end.
# specpack supplies label, gcc_prefix, build_ncpus and rv_exec with --define.
#
# perlbench: SPEC_LINUX_AARCH64 only selects SPEC_LINUX in its spec_config.h;
# CPU2017 has no RISC-V value, and the 64-bit data model comes from SPEC_LP64.
#------------------------------------------------------------------------------


#--------- Label --------------------------------------------------------------
%ifndef %{label}
%   error label is not defined: pass --define label=<label> (specpack does)
%endif

%ifndef %{build_ncpus}
%   error build_ncpus is not defined: pass --define build_ncpus=<n> (specpack does)
%endif


#--------- Global Settings ----------------------------------------------------
command_add_redirect = 1
flagsurl             = $[top]/config/flags/gcc.xml
ignore_errors        = 1
iterations           = 1
label                = %{label}
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=%{build_ncpus}
mean_anyway          = 1
output_format        = txt,html,cfg,pdf,csv
preenv               = 1
reportable           = 0
tune                 = base

default:
   bench_post_setup     = sync


#--------- How Many CPUs? -----------------------------------------------------
intrate,fprate:
   copies           = 1
intspeed,fpspeed:
   threads          = 1   # single-core BOOM target


#------- Compilers ------------------------------------------------------------
default:
#  gcc_prefix: the cross toolchain prefix, for example
#  /opt/riscv/bin/riscv64-unknown-linux-gnu- (specpack passes it from its settings).
%ifndef %{gcc_prefix}
%   error gcc_prefix is not defined: pass --define gcc_prefix=<cross prefix> (specpack does)
%endif
%define GCCge10                  # GCC 13
%define model -mabi=lp64d

# Static binaries need no runtime library path (the example's preENV_LD_LIBRARY_PATH).
   SPECLANG                = %{gcc_prefix}
   CC                      = $(SPECLANG)gcc      -std=c99   %{model} -static
   CXX                     = $(SPECLANG)g++      -std=c++03 %{model} -static
   FC                      = $(SPECLANG)gfortran            %{model} -static
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version

default:
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = Not Applicable


#--------- Portability --------------------------------------------------------
default:   # data model applies to all benchmarks
   EXTRA_PORTABILITY = -DSPEC_LP64

500.perlbench_r,600.perlbench_s:  #lang='C'
   PORTABILITY    = -DSPEC_LINUX_AARCH64

521.wrf_r,621.wrf_s:  #lang='F,C'
   CPORTABILITY  = -DSPEC_CASE_FLAG
   FPORTABILITY  = -fconvert=big-endian

523.xalancbmk_r,623.xalancbmk_s:  #lang='CXX'
   PORTABILITY   = -DSPEC_LINUX

526.blender_r:  #lang='CXX,C'
   PORTABILITY   = -funsigned-char -DSPEC_LINUX

527.cam4_r,627.cam4_s:  #lang='F,C'
   PORTABILITY   = -DSPEC_CASE_FLAG

628.pop2_s:  #lang='F,C'
   CPORTABILITY    = -DSPEC_CASE_FLAG
   FPORTABILITY    = -fconvert=big-endian


#----------------------------------------------------------------------
#       GCC workarounds that do not count as PORTABILITY
#----------------------------------------------------------------------
# SPEC's base settings: in base, workarounds apply to the whole suite.
# See https://www.spec.org/cpu2017/Docs/runrules.html#BaseFlags
#
   intrate,intspeed=base:
      EXTRA_CFLAGS = -fno-strict-aliasing -fno-unsafe-math-optimizations -fno-finite-math-only -fgnu89-inline -fcommon

   fprate,fpspeed=base:
      EXTRA_CFLAGS = -fno-strict-aliasing
%     ifdef %{GCCge10}
         EXTRA_FFLAGS = -fallow-argument-mismatch
%     endif


#-------- Tuning Flags common to Base and Peak --------------------------------
# Speed (OpenMP allowed)
   intspeed,fpspeed:
      EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP
   fpspeed:
      preENV_OMP_STACKSIZE = 120M


#--------  Base Tuning Flags ----------------------------------------------
default=base:         # flags for all base
   OPTIMIZE         = -g -O3 -march=rv64gc

default:
   basepeak = yes


#------------------------------------------------------------------------------
# Tester and System Descriptions
#------------------------------------------------------------------------------
default:
   sw_compiler001   = C/C++/Fortran: Version 13.2.0 of GCC, the
   sw_compiler002   = GNU Compiler Collection

intrate,intspeed,fprate,fpspeed: # Important: keep this line
   hw_vendor          = My Corporation
   tester             = My Corporation
   test_sponsor       = My Corporation
   license_num        = nnn (Your SPEC license number)

intrate,intspeed,fprate,fpspeed: # Important: keep this line
   hw_avail           = # Nov-2099
   sw_avail           = # Nov-2099
   fw_bios            = # Version Mumble released May-2099

intrate,intspeed,fprate,fpspeed: # Important: keep this line
   hw_cpu_nominal_mhz = # 9999
   hw_cpu_max_mhz     = # 9999
   hw_model           = # TurboBlaster 3000
   hw_ncores          = # 9999
   hw_ncpuorder       = # 1-9 chips
   hw_nthreadspercore = # 9
   hw_other           = # None
   hw_pcache          = # 99 KB I + 99 KB D on chip per core
   hw_scache          = # 99 KB I+D on chip per 9 cores
   hw_tcache          = # None
   hw_ocache          = # None
   sw_other           = # None
   power_management   = # briefly summarize power settings

#------------------------------------------------------------------------------
# Host-side execution (specpack passes these defines)
#   host_setup  input generators run through rv-exec, which sends RISC-V
#               programs to QEMU user mode
#   host_run    benchmarks and output checks run through rv-exec as well
# CPU2017 has no setup_submit: input generation uses the submit command, and
# SPEC records the submit command in the benchmark command files that specpack
# exports. So host_setup wraps only the generator executables, by name
# (submit_<executable>, the executable name without _base.<label>); the only
# intspeed generator is 625.x264_s's ldecod_s. The exported invocations then
# carry no host wrapper.
# Every setup starts from an empty run directory.
#------------------------------------------------------------------------------
default:
   deletework             = 1

%ifdef %{host_setup}
%   ifndef %{rv_exec}
%      error host_setup needs --define rv_exec=<path to specpack bin/rv-exec>
%   endif
default:
   submit_ldecod_s        = %{rv_exec} ${command}
   submit_ldecod_r        = %{rv_exec} ${command}
   use_submit_for_speed   = 1
%endif

%ifdef %{host_run}
%   ifndef %{rv_exec}
%      error host_run needs --define rv_exec=<path to specpack bin/rv-exec>
%   endif
default:
   submit                 = %{rv_exec} ${command}
   use_submit_for_speed   = 1
   use_submit_for_compare = 1
%endif
